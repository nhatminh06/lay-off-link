apiVersion: apps/v1
kind: Deployment
metadata:
  name: aide3-anomaly-consumer
  labels:
    app: aide3-anomaly-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aide3-anomaly-consumer
  template:
    metadata:
      labels:
        app: aide3-anomaly-consumer
    spec:
      containers:
      - name: anomaly-consumer
        image: aide3-serving:latest
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        - aide3.knative.event_consumer:app
        - --host
        - 0.0.0.0
        - --port
        - "8081"
        ports:
        - containerPort: 8081
        env:
        - name: ANOMALY_THRESHOLD
          value: "0.85"
---
apiVersion: v1
kind: Service
metadata:
  name: aide3-anomaly-consumer
spec:
  selector:
    app: aide3-anomaly-consumer
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  type: ClusterIP
---
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: default
  namespace: default
spec: {}
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: aide3-anomaly-trigger
  namespace: default
spec:
  broker: default
  filter:
    attributes:
      type: aide3.prediction.created
  subscriber:
    ref:
      apiVersion: v1
      kind: Service
      name: aide3-anomaly-consumer

