events {
    worker_connections 1024;
}

http {
    upstream ml_app { server ml-app:8000; }
    upstream mlflow { server mlflow:5000; }
    upstream grafana { server grafana:3000; }
    upstream prometheus { server prometheus:9090; }
    upstream jaeger { server jaeger:16686; }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;

        location /api/ {
            auth_basic "ML API Access";
            auth_basic_user_file /etc/nginx/htpasswd;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ml_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://ml_app/health;
            access_log off;
        }

        location /mlflow/ {
            auth_basic "MLflow Access";
            auth_basic_user_file /etc/nginx/htpasswd;
            proxy_pass http://mlflow/;
        }

        location /grafana/ {
            auth_basic "Monitoring Access";
            auth_basic_user_file /etc/nginx/htpasswd;
            proxy_pass http://grafana/;
        }

        location /metrics {
            proxy_pass http://ml_app/metrics;
            allow 172.16.0.0/12;
            deny all;
        }

        location / {
            return 200 "ML API Gateway\n";
            add_header Content-Type text/plain;
        }
    }
}
