name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  DOCKER_IMAGE: ml-app
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # Job 1: Linting and Code Quality
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 "black==24.10.0" pylint "setuptools<81"
          pip install -r aide1/requirements.txt

      - name: Run Black formatter check
        run: black --check .

      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pylint
        run: pylint aide1/app.py aide1/api.py --fail-under=7.0

  # Job 2: Unit Tests
  test:
    name: AIDE 1 Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-aide1-ci.txt

      - name: Run tests with coverage
        run: |
          pytest aide1/tests/ --cov=aide1 --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=80

      - name: Check coverage threshold
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "Test coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Test coverage ($COVERAGE%) is below 80% threshold"
            exit 1
          else
            echo "✅ Test coverage ($COVERAGE%) meets 80% threshold"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: aide1-coverage-xml
          path: coverage.xml

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  # Job 2b: AIDE 2 Tests
  test-aide2:
    name: AIDE 2 Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java (required by pyspark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-aide2-ci.txt

      - name: Run AIDE 2 tests
        run: |
          pytest aide2/tests/ -v --cov=aide2 --cov-report=xml --cov-report=term --cov-fail-under=35

  # Job 2c: AIDE 3 Tests
  test-aide3:
    name: AIDE 3 Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-aide3-ci.txt

      - name: Run AIDE 3 tests
        run: |
          pytest aide3/tests/ -v --cov=aide3 --cov-report=xml --cov-report=term --cov-fail-under=70

  # Job 3: Build Docker Images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, test-aide2, test-aide3]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./aide1
          file: ./aide1/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Build and push Spark image
        uses: docker/build-push-action@v6
        with:
          context: ./aide2
          file: ./aide2/Dockerfile.spark
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/spark-jobs:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/spark-jobs:latest

      - name: Build and push Flink image
        uses: docker/build-push-action@v6
        with:
          context: ./aide2
          file: ./aide2/Dockerfile.flink
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flink-jobs:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/flink-jobs:latest

      - name: Build and push Feast image
        uses: docker/build-push-action@v6
        with:
          context: ./aide2/feast
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/feast-server:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/feast-server:latest

      - name: Build and push AIDE 3 serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./aide3/serving/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aide3-serving:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/aide3-serving:latest

      - name: Scan ml-app image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: 'sarif'
          output: 'trivy-ml-app.sarif'

      - name: Scan spark-jobs image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/spark-jobs:${{ env.DOCKER_TAG }}
          format: 'sarif'
          output: 'trivy-spark-jobs.sarif'

      - name: Scan flink-jobs image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/flink-jobs:${{ env.DOCKER_TAG }}
          format: 'sarif'
          output: 'trivy-flink-jobs.sarif'

      - name: Scan feast-server image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/feast-server:${{ env.DOCKER_TAG }}
          format: 'sarif'
          output: 'trivy-feast-server.sarif'

      - name: Scan aide3-serving image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/aide3-serving:${{ env.DOCKER_TAG }}
          format: 'sarif'
          output: 'trivy-aide3-serving.sarif'

      - name: Upload ml-app Trivy results to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-ml-app.sarif
          category: trivy-ml-app

      - name: Upload spark-jobs Trivy results to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-spark-jobs.sarif
          category: trivy-spark-jobs

      - name: Upload flink-jobs Trivy results to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-flink-jobs.sarif
          category: trivy-flink-jobs

      - name: Upload feast-server Trivy results to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-feast-server.sarif
          category: trivy-feast-server

      - name: Upload aide3-serving Trivy results to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-aide3-serving.sarif
          category: trivy-aide3-serving

  # Job 4: Deploy to Kubernetes (manual only — never runs on push)
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ml-app.example.com
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Require kubeconfig secret
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::KUBE_CONFIG secret is not configured. A manual deploy was requested but there is no cluster credential to deploy with. Configure the KUBE_CONFIG repository secret (base64-encoded kubeconfig) before re-running this workflow."
            exit 1
          fi

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$KUBECONFIG"
          kubectl config get-contexts

      - name: Update deployment image
        run: |
          kubectl set image deployment/ml-app-deployment \
            ml-app=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ml-app-deployment
          kubectl get pods

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -f http://ml-app-service/health

  # NOTE: A "Performance Testing" job previously ran here, pointing at
  # tests/load_test.js. That file does not exist anywhere in this repository,
  # so the job could only ever fail (or silently pass against nothing once
  # deploy was skipped). It has been removed rather than left as a job that
  # always fails or misrepresents benchmark evidence. A real k6 script and a
  # manually-triggered benchmark workflow are tracked as follow-up work.
