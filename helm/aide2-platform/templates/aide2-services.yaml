---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
spec:
  replicas: {{ .Values.spark.masterReplicas }}
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: {{ .Values.spark.image }}
          env:
            - name: SPARK_MODE
              value: master
          ports:
            - containerPort: {{ .Values.spark.masterPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
spec:
  replicas: {{ .Values.spark.workerReplicas }}
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: {{ .Values.spark.image }}
          env:
            - name: SPARK_MODE
              value: worker
            - name: SPARK_MASTER_URL
              value: spark://spark-master:{{ .Values.spark.masterPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
spec:
  replicas: {{ .Values.flink.jobmanagerReplicas }}
  selector:
    matchLabels:
      app: flink-jobmanager
  template:
    metadata:
      labels:
        app: flink-jobmanager
    spec:
      containers:
        - name: flink-jobmanager
          image: {{ .Values.flink.image }}
          args: ["jobmanager"]
          ports:
            - containerPort: {{ .Values.flink.webPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
spec:
  replicas: {{ .Values.flink.taskmanagerReplicas }}
  selector:
    matchLabels:
      app: flink-taskmanager
  template:
    metadata:
      labels:
        app: flink-taskmanager
    spec:
      containers:
        - name: flink-taskmanager
          image: {{ .Values.flink.image }}
          args: ["taskmanager"]
